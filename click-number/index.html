<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/styles.css">
    <title>Click-Number</title>
</head>
<body>
    <div id="timer">0.000</div>
    <div id="game-controls" style="text-align: center; margin-top: 10px;">
        <label for="difficulty">難易度:</label>
        <select id="difficulty" style="margin-right: 10px; padding: 5px; font-size: 16px;">
            <option value="10">簡単 (10個)</option>
            <option value="20">普通 (20個)</option>
            <option value="30">難しい (30個)</option>
        </select>
        <button id="start-game-button" style="padding: 8px 15px; font-size: 16px; cursor: pointer;">ゲーム開始</button>
    </div>
    <div id="game-container"></div>
    <script src="js/scripts.js"></script>
</body>
</html>
